workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GTU_Student
    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.house.houseChores
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          parse_build() {
            echo "$1" | grep -E '^[0-9]+$' | tail -n 1
          }
          TF_RAW=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS || true)
          AS_RAW=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" --platform IOS || true)
          echo "TestFlight latest: $TF_RAW"
          echo "App Store latest: $AS_RAW"
          TF=$(parse_build "$TF_RAW")
          AS=$(parse_build "$AS_RAW")
          [ -z "$TF" ] && TF=0
          [ -z "$AS" ] && AS=0
          # Apple already used CFBundleVersion 1–4 (internal TestFlight builds).
          MIN=4
          LATEST=$MIN
          [ "$TF" -gt "$LATEST" ] && LATEST=$TF
          [ "$AS" -gt "$LATEST" ] && LATEST=$AS
          NEXT_BUILD=$((LATEST + 1))
          echo "Building 1.0.0 ($NEXT_BUILD) (Apple latest=$LATEST)"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
