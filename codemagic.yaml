workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: GTU_Student
    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.house.houseChores
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build IPA
        script: |
          set -e
          digits() {
            echo "$1" | tr -cd '0-9'
          }
          TF=$(digits "$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || true)")
          AS=$(digits "$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || true)")
          [ -z "$TF" ] && TF=0
          [ -z "$AS" ] && AS=0
          LATEST=$TF
          [ "$AS" -gt "$LATEST" ] && LATEST=$AS
          [ "$LATEST" -lt 1 ] && LATEST=1
          NEXT_BUILD=$((LATEST + 1))
          echo "Building 1.0.0 ($NEXT_BUILD) (Apple latest=$LATEST)"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
